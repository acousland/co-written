name: Verify Co-written
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Server security tests
        run: PYTHONPATH=server python3 -m unittest discover -s server/tests -v
      - name: Build universal app
        run: scripts/build-app.sh
      - name: Verify universal binary and signature
        run: |
          codesign --verify --deep --strict dist/Co-written.app
          lipo -verify_arch arm64 x86_64 dist/Co-written.app/Contents/MacOS/CoWrittenMac
