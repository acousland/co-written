# Include inside your HTTPS server block. Set up TLS and the domain there.
# In nginx's http block, define:
# limit_req_zone $binary_remote_addr zone=cowritten:10m rate=2r/s;
location / {
    client_max_body_size 100k;
    client_body_timeout 10s;
    limit_req zone=cowritten burst=10 nodelay;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 80s;
    # Avoid writing usage/identity metadata in this application location.
    access_log off;
}
